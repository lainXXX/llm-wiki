name: 问题反馈 / Bug report
description: 报告可复现的问题，帮助改进脚本或 skill 工作流。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 Issues。日志和样例请脱敏，不要公开密钥或私人材料。
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js 版本、项目版本或提交；涉及 skill 行为时附 Claude Code 版本。
      placeholder: "Windows 11 / Node.js 24.x / llm-wiki 0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小样例和完整命令；请勿上传自己的完整知识库。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏日志或错误输出。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关 Issue、回归版本或已尝试的解决办法。
